<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Quiet Quarry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed isometric map with a docked panel (right on desktop, bottom sheet on phones).
   Single dark look on purpose: an evening at the quarry, slate neutrals with warm lantern amber. */
:root{
  --bg:#13161b; --map:#0e1115; --panel:#191d23; --panel-2:#1f242c; --panel-3:#262c35; --line:#2f3641;
  --fg:#e9e4d7; --muted:#9aa1ab; --faint:#6c737e;
  --accent:#f0a830; --accent-ink:#1b1408; --cyan:#5fd0d8; --good:#73c48f; --bad:#e3654f;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
#top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.005em;color:var(--accent);line-height:.95;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.ctl input[type=range]{width:110px;accent-color:var(--accent)}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px}
.spacer{flex:1}
.hbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-weight:600;font-size:13px}
.hbtn:hover{border-color:var(--faint)}
.hbtn.armed{background:var(--bad);border-color:var(--bad);color:#1a0d0a}
.turbo-pill{font-family:var(--f-mono);font-size:12px;background:var(--cyan);color:#06191b;border-radius:99px;padding:3px 9px;font-weight:600}

/* ---------- main ---------- */
#main{flex:1;min-height:0;display:flex}
#mapWrap{position:relative;flex:1;min-width:0;background:var(--map);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
#map.panning{cursor:grabbing}

#tools{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:3;max-height:calc(100% - 32px);overflow-y:auto;padding-right:2px;-webkit-user-select:none;user-select:none}
.tool{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:150px;padding:7px 10px;border-radius:6px;
  background:rgba(25,29,35,.92);border:1px solid var(--line);text-align:left;font-weight:600;font-size:13px}
.tool small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.tool:hover{border-color:var(--faint)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:rgba(240,168,48,.16);box-shadow:inset 3px 0 0 var(--accent)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.brush{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:rgba(25,29,35,.92);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.brush .seg button{padding:3px 8px;font-size:12px}

#mapHud{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;z-index:3}
#mapHud button{width:36px;height:36px;border-radius:6px;background:rgba(25,29,35,.92);border:1px solid var(--line);font-weight:700;font-size:16px}
#supportBtn{position:absolute;right:16px;bottom:62px;z-index:3;display:flex;align-items:center;gap:8px;max-width:min(240px,calc(100% - 32px));
  padding:7px 12px 7px 9px;border-radius:99px;background:rgba(25,29,35,.94);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:left;line-height:1.25}
#supportBtn:hover:not(:disabled){border-color:var(--accent)}
#supportBtn:disabled{opacity:.55;cursor:wait}
#supportBtn svg{flex:none;width:18px;height:18px;color:var(--accent)}
#legend{position:absolute;left:16px;bottom:16px;z-index:3;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 300px);
  padding:7px 10px;border-radius:6px;background:rgba(25,29,35,.88);border:1px solid var(--line);font-size:12px;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid rgba(255,255,255,.18)}
#cutNote{position:absolute;top:16px;right:16px;z-index:3;font-family:var(--f-mono);font-size:12px;background:rgba(240,168,48,.18);border:1px solid var(--accent);color:var(--fg);padding:4px 9px;border-radius:6px}
#tip{position:absolute;z-index:6;pointer-events:none;max-width:340px;padding:6px 9px;border-radius:6px;background:rgba(10,12,16,.94);border:1px solid var(--line);
  font-family:var(--f-mono);font-size:12px;line-height:1.35;color:var(--fg)}
#tip b{color:var(--accent);font-weight:600}
#toasts{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:7;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:rgba(25,29,35,.96);border:1px solid var(--line);border-left:3px solid var(--accent);padding:7px 11px;border-radius:6px;font-size:13px;animation:tin .25s ease-out}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- panel ---------- */
#panel{width:390px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#panelHead{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
#tabs{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs button{flex:1 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 6px 8px;font-weight:600;font-size:12.5px;color:var(--muted)}
#tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
#panelToggle{display:none;background:transparent;border:0;border-left:1px solid var(--line);padding:0 14px;color:var(--muted);font-weight:700}
#tabBody{flex:1;overflow-y:auto;padding:14px 16px 28px;min-height:0}
#tabBody h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.005em;margin:0;line-height:1.15;text-wrap:balance}
#tabBody h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:700}
#tabBody h3:first-child{margin-top:0}
#tabBody p{margin:0 0 8px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--panel-3);color:var(--muted)}
.pill.on{background:rgba(240,168,48,.18);color:var(--accent)}
.pill.good{background:rgba(115,196,143,.16);color:var(--good)}
.pill.bad{background:rgba(227,101,79,.16);color:var(--bad)}
.vox{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;word-break:break-word}
.cbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--panel-3);margin:6px 0 2px}
.cbar i{display:block;height:100%}
.btn{background:var(--panel-3);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-weight:600;font-size:13px;text-align:center;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#1a0d0a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row .grow{flex:1;min-width:0}
.title{font-weight:700;font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar.cy i{background:var(--cyan)}
.core{display:flex;flex-direction:column;gap:3px}
.core-row{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;font-size:12px}
.core-row .z{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.core-row .cbar{margin:0;height:12px}
.core-row .unk{height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--panel-3) 0 4px,var(--panel-2) 4px 8px)}
.core-row.top .z{color:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--panel-3)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
table.goods{width:100%;border-collapse:collapse;font-size:13px}
table.goods th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.goods td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.goods td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.goods th.n{text-align:right}
table.goods td.act{text-align:right;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
.goal{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.goal .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);margin-top:2px}
.goal.done .ck{background:var(--good);border-color:var(--good)}
.goal.done .gt{color:var(--muted);text-decoration:line-through}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.keys kbd{font-family:var(--f-mono);font-size:11px;background:var(--panel-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap}
select.rsel{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.recipe{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.recipe .grow{min-width:0}
/* land map: a 5×5 grid tilted to match the isometric view */
.landmap{display:flex;justify-content:center;align-items:center;height:150px;margin:6px 0 2px;overflow:hidden}
.landgrid{display:grid;grid-template-columns:repeat(5,30px);gap:3px;transform:scaleY(.56) rotate(45deg)}
.landgrid button{width:30px;height:30px;border-radius:3px;border:1px solid var(--line);background:var(--panel-3);padding:0}
.landgrid button.own{background:var(--accent);border-color:var(--accent)}
.landgrid button.sale{background:rgba(240,168,48,.12);border:2px dashed var(--accent)}
.landgrid button.hid{opacity:.4}
.landgrid button.home{box-shadow:inset 0 0 0 9px rgba(27,20,8,.5)}
.landgrid button.sel{outline:3px solid var(--fg);outline-offset:1px}
.landkey{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.landkey span{display:inline-flex;align-items:center;gap:5px}
.landkey i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- settings and privacy windows ---------- */
.hbtn.ico{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px}
.hbtn.ico svg{width:17px;height:17px}
dialog.dlg{width:min(440px,calc(100% - 32px));max-height:min(86vh,720px);padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);box-shadow:0 18px 50px rgba(0,0,0,.55)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg::backdrop{background:rgba(6,8,10,.62)}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.dlg-hd h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;line-height:1.15}
.dlg-x{flex:none;width:34px;height:34px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:18px;line-height:1}
.dlg-body{padding:4px 16px 18px;overflow-y:auto;min-height:0}
.dlg-body h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:700}
.dlg-body p{margin:0 0 8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px}
.opt>span{flex:none}
.opt input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.opt input[type=range]{flex:1;min-width:0;max-width:220px;accent-color:var(--accent)}
.opt select{flex:1;min-width:0;max-width:220px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.np{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;font-size:13px}
.dlg-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.policy{font-size:13.5px;line-height:1.5}
.policy ul{margin:0 0 8px;padding-left:20px}
.policy li{margin:3px 0}
.policy a{color:var(--accent)}
.policy .pp-date{color:var(--muted);font-size:12.5px;margin-top:10px}

@media (max-width: 860px){
  #main{flex-direction:column}
  #panel{width:auto;height:46%;border-left:0;border-top:1px solid var(--line)}
  #panel.collapsed{height:auto}
  #panel.collapsed #tabBody{display:none}
  #panelToggle{display:block}
  #tabBody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #tools{flex-direction:row;left:16px;right:16px;top:12px;max-height:none;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:none}
  .tool{min-width:0;flex:none;flex-direction:column;align-items:flex-start;gap:0;padding:5px 9px}
  .brush{flex:none}
  #legend{display:none}
  #cutNote{top:auto;bottom:16px;right:auto;left:16px}
  .brand{font-size:21px}
  .brand small{display:none}
  .ctl .lbl{display:none}
  .ctl input[type=range]{width:80px}
  #top{gap:8px 12px;padding-block:6px}
  .stat .val{font-size:15px}
  .ctl select{max-width:150px;padding:4px 6px}
  .seg button{padding:4px 8px}
  .hbtn{padding:4px 9px}
  #supportBtn{font-size:12px;max-width:min(210px,calc(100% - 32px))}
}
@media (prefers-reduced-motion: reduce){ .toast{animation:none} }
</style>

<div id="app">
  <header id="top">
    <div class="brand">Quiet Quarry<small>A calm little mining game</small></div>
    <div class="stat"><span class="lbl">Cash</span><span class="val" id="cash">$0</span></div>
    <div class="stat"><span class="lbl">Ore at pad</span><span class="val" id="oreTotal">0 t</span></div>
    <div class="seg" role="group" aria-label="Game speed" id="speedSeg">
      <button data-speed="0" aria-pressed="false" title="Pause (Space)">Pause</button>
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2" aria-pressed="false">2×</button>
      <button data-speed="4" aria-pressed="false">4×</button>
    </div>
    <span class="turbo-pill" id="turboPill" hidden>Turbo 60s</span>
    <span class="spacer"></span>
    <label class="ctl"><span class="lbl">View</span>
      <select id="overlay" aria-label="Map view">
        <option value="natural">Terrain + survey</option>
        <option value="1">Coal heat map</option>
        <option value="2">Iron heat map</option>
        <option value="3">Aluminium heat map</option>
        <option value="4">Silver heat map</option>
        <option value="5">Gold heat map</option>
        <option value="6">Lithium heat map</option>
      </select>
    </label>
    <label class="ctl"><span class="lbl">Cutaway</span>
      <input type="range" id="slice" min="1" max="12" value="12" aria-label="Cutaway depth">
      <output id="sliceVal">off</output>
    </label>
    <button class="hbtn" id="btnSave">Save</button>
    <button class="hbtn" id="btnNew">New map</button>
    <button class="hbtn ico" id="btnSettings" title="Settings: music, sounds, privacy" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="main">
    <div id="mapWrap">
      <canvas id="map" aria-label="Isometric mining map"></canvas>
      <div id="tools" role="toolbar" aria-label="Map tools">
        <button class="tool" data-tool="inspect" aria-pressed="true">Inspect<small>1</small></button>
        <button class="tool" data-tool="dig" aria-pressed="false">Mark dig<small>2</small></button>
        <button class="tool" data-tool="undig" aria-pressed="false">Unmark dig<small>3</small></button>
        <button class="tool" data-tool="probe" aria-pressed="false">Probe<small>$15</small></button>
        <button class="tool" data-tool="core" aria-pressed="false">Core drill<small id="tcCore">×0</small></button>
        <button class="tool" data-tool="charge" aria-pressed="false">Survey charge<small id="tcCharge">×0</small></button>
        <button class="tool" data-tool="focus" aria-pressed="false">Drone focus<small>7</small></button>
        <button class="tool" id="btnTurbo" aria-pressed="false">Turbo fuel<small id="tcTurbo">×0</small></button>

<p>Quiet Quarry is a single-player mining game made by {{DEVELOPER}} ("we", "us"). This policy explains what information the game uses and why. In short: we don't collect any information about you. The phone app can show optional ads from Google AdMob, and Google handles the information those ads need.</p>
<h3>The game itself</h3>

/* =====================================================================
   GAME STATE
   ===================================================================== */
let G = null;
let slice = H, overlay = 'natural', tool = 'inspect', brush = 1, sel = -1, landSel = -1;
const particles = [], floaters = [];

function newState(seed) {

    goals: {}, stats: { mined: 0, surveyed: 0, earned: 0, tailings: 0, extracted: {}, produced: {}, assembled: 0 },
    demand: {}, focus: { x: CX, y: CY }, turbo: 0, vehicles: [], buildings: [], nextId: 1, owned: [HOME_REG],

}
function newGame(seed) {

function parkSpot(v) {

/* ---------- multipliers ---------- */
const turboMul = () => G.turbo > 0 ? 2 : 1;
const speedOf = v => VEH[v.type].speed * (1 + 0.35 * G.upgrades.engine) * turboMul();
const rateOf = v => VEH[v.type].rate * Math.pow(1.5, G.upgrades.drill) * turboMul();

function hasMats(m) { for (const k in m) if ((G.storage[k] || 0) + 1e-9 < m[k]) return false; return true; }
function payMats(m) { for (const k in m) G.storage[k] = Math.max(0, G.storage[k] - m[k]); }

/* =====================================================================
   SIMULATION
   ===================================================================== */

}
function digValid(ci) { return ci >= 0 && designated[ci] && !kind[ci] && h[ci] > 1 && colVis[ci] === 2; }
function findDigJob(v) {

      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= D) continue;

function stepMiner(v, dt) {

    case 'idle': {
      v.timer -= dt; if (v.timer > 0) return;
      v.timer = 0.5;

      if (j >= 0) goJob(v, j);
      return;
    }
    case 'toSite':
      if (!digValid(v.job)) { const j = findDigJob(v); if (j >= 0) goJob(v, j); else goPad(v); return; }
      if (moveTo(v, v.tx, v.ty, speedOf(v), dt)) v.state = 'mining';
      return;

      const ci = v.job;

function deliver(R) {

}

  wood: [['kick', 0, .65], ['shaker', 2, .5], ['shaker', 6, .6], ['wood', 6, .45], ['kick', 8, .35], ['shaker', 10, .5], ['wood', 11, .3], ['shaker', 14, .6], ['wood', 14, .3]],
  soft: [['kick', 0, .6], ['hat', 2, .45], ['brush', 4, .7], ['hat', 6, .45], ['kick', 7, .3], ['hat', 8, .3], ['kick', 10, .45], ['hat', 10, .45], ['brush', 12, .7], ['hat', 14, .45], ['hat', 15, .25]],
  shaker: [['kick', 0, .45], ['shaker', 4, .5], ['shaker', 8, .25], ['shaker', 12, .5]],

const AU = { ctx: null, mb: null, sb: null, noise: null, held: false };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const wrap = (n, lo) => lo + ((n - lo) % 12 + 12) % 12;
function musicLevel() { return SET.music ? SET.musicVol * SET.musicVol * 1.3 : 0; }
function sfxLevel() { return SET.sfx ? SET.sfxVol * SET.sfxVol * 0.9 : 0; }

function audioInit() {
  if (AU.ctx) return AU.ctx;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  let c; try { c = new AC({ latencyHint: 'playback' }); } catch (e) { try { c = new AC(); } catch (e2) { return null; } }
  AU.ctx = c;
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
  comp.connect(c.destination); AU.out = comp;
  // shared reverb and a dotted-eighth echo, both darkened so nothing gets bright or harsh
  const verb = c.createConvolver(), vtone = filt('lowpass', 4500);
  const n = Math.floor(c.sampleRate * 3.4), ir = c.createBuffer(2, n, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  verb.buffer = ir; verb.connect(vtone); vtone.connect(comp);
  const delay = c.createDelay(2), fb = c.createGain(), dtone = filt('lowpass', 2400), dverb = c.createGain();
  delay.delayTime.value = 0.6; fb.gain.value = 0.3; dverb.gain.value = 0.3;
  delay.connect(dtone); dtone.connect(fb); fb.connect(delay); dtone.connect(comp); dtone.connect(dverb); dverb.connect(verb);
  AU.delay = delay;
  const bus = () => { const b = { dry: c.createGain(), wet: c.createGain(), del: c.createGain() }; b.dry.connect(comp); b.wet.connect(verb); b.del.connect(delay); return b; };
  AU.mb = bus(); AU.sb = bus();
  for (const g of Object.values(AU.mb)) g.gain.value = 0;
  for (const g of Object.values(AU.sb)) g.gain.value = sfxLevel();
  AU.noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const nd = AU.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  document.addEventListener('visibilitychange', audioSync);
  setInterval(musicTick, 50);
  return c;
}
// music stops while the app is in the background, during an ad, or when both music and sounds are off
function audioSync() {
  const c = AU.ctx; if (!c) return;
  const want = !document.hidden && !AU.held && (SET.music || SET.sfx);
  if (want && c.state !== 'running') c.resume().catch(() => {});
  else if (!want && c.state === 'running') c.suspend().catch(() => {});
}
function setBusGain(b, v, tc = 0.05) {
  const t = AU.ctx.currentTime;
  for (const g of [b.dry, b.wet, b.del]) {
    const p = g.gain;
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
    p.setTargetAtTime(v, t, tc);
  }
}

/* ---------- instruments: each call builds a few short-lived nodes ---------- */
function filt(type, f, q = 0.7) { const b = AU.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function gainN(v) { const g = AU.ctx.createGain(); g.gain.value = v; return g; }
function osc(type, f, t, end, detune = 0) { const o = AU.ctx.createOscillator(); o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune; o.start(t); o.stop(end); return o; }
function noiseSrc(t, end) { const s = AU.ctx.createBufferSource(); s.buffer = AU.noise; s.loop = true; s.start(t, Math.random() * 0.9); s.stop(end); return s; }
// envelope: attack, hold at peak, then an exponential tail; returns the gain node and when it is silent
function amp(t, peak, a, hold, rel) {
  const g = AU.ctx.createGain(), p = g.gain;
  p.setValueAtTime(0, t); p.linearRampToValueAtTime(peak, t + a);
  if (hold > 0) p.setValueAtTime(peak, t + a + hold);
  p.setTargetAtTime(0, t + a + hold, rel / 3);
  return [g, t + a + hold + rel * 1.6];
}
function route(node, B, wet, del) {
  node.connect(B.dry);
  if (wet) { const g = gainN(wet); node.connect(g); g.connect(B.wet); }
  if (del) { const g = gainN(del); node.connect(g); g.connect(B.del); }
}
function partial(t, f, peak, rel, out, type = 'sine') { const [g, end] = amp(t, peak, 0.004, 0, rel); osc(type, f, t, end).connect(g); g.connect(out); return end; }
const INST = {
  keys(t, m, dur, v, B) {   // soft electric piano (two-operator FM)
    const f = mtof(m), [g, end] = amp(t, 0.12 * v, 0.006, 0, Math.min(2.4, 0.7 + dur));
    const car = osc('sine', f, t, end), mod = osc('sine', f, t, end), mi = AU.ctx.createGain();
    mi.gain.setValueAtTime(f * 1.3 * v, t); mi.gain.setTargetAtTime(f * 0.1, t, 0.18);
    mod.connect(mi); mi.connect(car.frequency); car.connect(g); route(g, B, 0.35, 0.12);
  },
  pluck(t, m, dur, v, B) {
    const f = mtof(m), [g, end] = amp(t, 0.08 * v, 0.004, 0, 0.55), lp = filt('lowpass', 900 + 2000 * v);
    lp.frequency.setTargetAtTime(500, t, 0.12);
    osc('triangle', f, t, end).connect(lp); const o2 = osc('sine', f * 2, t, end), g2 = gainN(0.3); o2.connect(g2); g2.connect(lp);
    lp.connect(g); route(g, B, 0.3, 0.35);
  },
  kalimba(t, m, dur, v, B) {
    const f = mtof(m), out = gainN(v); partial(t, f, 0.11, 1.0, out); partial(t, f * 5.6, 0.025, 0.07, out); route(out, B, 0.35, 0.2);
  },
  marimba(t, m, dur, v, B) {
    const f = mtof(m), out = gainN(v); partial(t, f, 0.14, 0.6, out); partial(t, f * 4, 0.035, 0.06, out); partial(t, f * 9.8, 0.01, 0.02, out); route(out, B, 0.3, 0.1);
  },
  bell(t, m, dur, v, B) {
    const f = mtof(m), out = gainN(v); partial(t, f, 0.075, 2.6, out); partial(t, f * 2.76, 0.026, 1.1, out); partial(t, f * 5.4, 0.01, 0.45, out); route(out, B, 0.5, 0.15);
  },
  flute(t, m, dur, v, B) {
    const f = mtof(m), [g, end] = amp(t, 0.07 * v, 0.14, Math.max(0, dur - 0.14), 0.5);
    const o = osc('sine', f, t, end), lfo = osc('sine', 5.2, t, end), lg = gainN(f * 0.004);
    lfo.connect(lg); lg.connect(o.frequency); o.connect(g);
    const o2 = osc('triangle', f * 2, t, end), g2 = gainN(0.1); o2.connect(g2); g2.connect(g);
    route(g, B, 0.45, 0.2);
  },
  pad(t, notes, dur, v, B) {
    const [g, end] = amp(t, 0.03 * v, 1.8, Math.max(0, dur - 1.8), 2.6), lp = filt('lowpass', 450, 0.5);
    lp.frequency.setValueAtTime(450, t); lp.frequency.linearRampToValueAtTime(1250, t + dur * 0.6); lp.frequency.linearRampToValueAtTime(750, t + dur + 1);
    for (const m of notes) { const f = mtof(m); osc('sawtooth', f, t, end, -7).connect(lp); osc('triangle', f, t, end, 6).connect(lp); }
    lp.connect(g); route(g, B, 0.6, 0);
  },
  bass(t, m, dur, v, B) {
    const f = mtof(m), [g, end] = amp(t, 0.16 * v, 0.02, dur * 0.75, 0.3), lp = filt('lowpass', 420), gl = gainN(0.35);
    osc('sine', f, t, end).connect(g); osc('triangle', f, t, end).connect(lp); lp.connect(gl); gl.connect(g); route(g, B, 0.08, 0);
  },
};
const PERC = {
  kick(t, v, B) { const [g, end] = amp(t, 0.26 * v, 0.004, 0, 0.32), o = osc('sine', 110, t, end); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); o.connect(g); route(g, B, 0.05, 0); },
  hat(t, v, B) { const [g, end] = amp(t, 0.03 * v, 0.002, 0, 0.05), f = filt('highpass', 7500); noiseSrc(t, end).connect(f); f.connect(g); route(g, B, 0.2, 0); },
  shaker(t, v, B) { const [g, end] = amp(t, 0.03 * v, 0.012, 0, 0.07), f = filt('bandpass', 5500, 1.2); noiseSrc(t, end).connect(f); f.connect(g); route(g, B, 0.2, 0); },
  brush(t, v, B) { const [g, end] = amp(t, 0.04 * v, 0.02, 0, 0.2), f = filt('bandpass', 2800, 0.6); noiseSrc(t, end).connect(f); f.connect(g); route(g, B, 0.3, 0); },
  wood(t, v, B) { const [g, end] = amp(t, 0.05 * v, 0.002, 0, 0.05); osc('triangle', 1250, t, end).connect(g); route(g, B, 0.35, 0.2); },
};

/* ---------- generative sequencer: four chords, layered sections, a repeating motif ---------- */
const M = { on: false, tr: null, ti: 0, plays: 0, step: 0, bar: 0, nextT: 0, rng: Math.random, motif: [], lead: [], arpI: 0, nextAt: 0, pending: null };
function genMotif(bars) {
  const out = []; let idx = 4 + Math.floor(M.rng() * 3);
  for (let b = 0; b < bars; b++) for (const [st, du] of RHYTHMS[Math.floor(M.rng() * RHYTHMS.length)]) {
    idx = clamp(idx + WALK[Math.floor(M.rng() * WALK.length)], 2, 10); out.push({ bar: b, st, du, idx });
  }
  return out;
}
// an 8-bar melody: A, A with a new ending, B, then A again resolving to the key note
function sectionLead() {
  const at = (list, b) => list.map(e => ({ ...e, bar: e.bar + b })), A = M.motif;
  const A2 = A.map((e, i) => i >= A.length - 2 ? { ...e, idx: clamp(e.idx + (M.rng() < 0.5 ? -1 : 1) * (1 + Math.floor(M.rng() * 2)), 2, 10) } : e);
  const end = at(A, 6); if (end.length) { const l = end[end.length - 1]; l.idx = Math.round(l.idx / 5) * 5 || 5; }
  return [...at(A, 0), ...at(A2, 2), ...at(genMotif(2), 4), ...end];
}
function startTrack(i) {
  const c = AU.ctx; if (!c) return;
  M.ti = (i + TRACKS.length) % TRACKS.length; M.tr = TRACKS[M.ti]; M.plays++;
  M.rng = mulberry32(M.tr.seed * 7919 + M.plays * 104729);
  M.step = 0; M.bar = 0; M.arpI = 0; M.nextT = c.currentTime + 0.15; M.on = true; M.nextAt = 0; M.pending = null;
  M.motif = genMotif(2); M.lead = [];
  AU.delay.delayTime.setValueAtTime(45 / M.tr.bpm, c.currentTime);
  setBusGain(AU.mb, musicLevel(), 0.6);
  updateNowPlaying();
}
function switchTrack(i) {
  const c = AU.ctx; if (!c) return;
  M.on = false; M.pending = i; M.nextAt = c.currentTime + 2; setBusGain(AU.mb, 0, 0.35);
}
function musicTick() {
  const c = AU.ctx; if (!c || c.state !== 'running') return;
  const now = c.currentTime;
  if (M.nextAt && now >= M.nextAt) {
    M.nextAt = 0;
    if (SET.music) startTrack(M.pending ?? (SET.track >= 0 ? SET.track : M.ti + 1));
    return;
  }
  if (!M.on) return;
  if (M.nextT < now - 0.3) M.nextT = now + 0.05;   // after a pause, skip ahead instead of rushing to catch up
  while (M.nextT < now + 0.3) {
    if (M.bar >= SECTIONS.length * 8) { M.on = false; M.nextAt = M.nextT + 6; return; }   // last chord rings out, then a short breath
    playStep(M.nextT);
    M.nextT += 15 / M.tr.bpm;
    if (++M.step === 16) { M.step = 0; M.bar++; }
  }
}
function playStep(t) {
  const T = M.tr, s = M.step, bar = M.bar, sd = 15 / T.bpm, B = AU.mb, rng = M.rng;
  const L = SECTIONS[bar >> 3], bi = bar % 8;
  const tt = t + (s % 2 ? T.swing * sd : 0) + (rng() - 0.5) * 0.008;
  const [cr, cq] = T.chords[(bar >> 1) % T.chords.length], root = T.key + cr, tones = CHORD[cq];
  const pcs = tones.map(i => (root + i) % 12);
  if (s === 0 && bi === 0 && L.includes('l')) M.lead = sectionLead();
  if (s === 0 && bar % 2 === 0) INST.pad(tt, tones.map(i => i < 12 ? wrap(root + i, 53) : wrap(root + i, 65)), 32 * sd, bar === 0 ? 0.7 : 1, B);
  if (L.includes('b')) {
    const k = T.bassSteps.indexOf(s);
    if (k >= 0) INST.bass(tt, wrap(root, 36) + [0, 7, 12, 7][k % 4], ((T.bassSteps[k + 1] ?? 16) - s) * sd, k ? 0.75 : 1, B);
  }
  if (L.includes('a') && T.arpSteps.includes(s) && rng() > 0.12) {
    const low = [...new Set(tones.map(i => wrap(root + i, 60)))].sort((a, b) => a - b), pool = low.concat(low.map(m => m + 12));
    const n = pool.length, k = M.arpI++ % (2 * n - 2), m = pool[k < n ? k : 2 * n - 2 - k];
    INST[T.arp](tt, m, 2 * sd, s === 0 ? 0.9 : 0.55 + rng() * 0.3, B);
  }
  if (L.includes('h')) for (const [p, st, v] of GROOVES[T.perc]) if (st === s && rng() > 0.06) PERC[p](tt, v * (0.85 + rng() * 0.3), B);
  if (L.includes('l')) for (const e of M.lead) if (e.bar === bi && e.st === s) {
    let m = 60 + T.key % 12 + T.scale[e.idx % 5] + 12 * Math.floor(e.idx / 5);
    if ((e.du >= 4 || s % 8 === 0) && !pcs.includes(m % 12)) { const d = [-1, 1, -2, 2].find(d => pcs.includes((m + d) % 12)); if (d) m += d; }
    INST[T.lead](tt, m, e.du * sd, 0.7 + rng() * 0.25, B);
  }
}

/* ---------- game sounds: short, soft, and tuned to the key of the current track ---------- */
const SFX_GAP = { dig: 0.35, unload: 0.4, scan: 0.9, made: 2, mark: 0.07, tick: 0.06, coin: 0.12, pip: 0.1, good: 0.25, bad: 0.3, goal: 0.5, charge: 0.4 };
const sfxLast = {}; let sfxAny = -1;
function blip(t, f, dur, peak, type, B, bend = 1) {
  const [g, end] = amp(t, peak, 0.004, 0, dur), o = osc(type, f, t, end);
  if (bend !== 1) o.frequency.exponentialRampToValueAtTime(f * bend, t + dur);
  o.connect(g); route(g, B, 0.25, 0);
}
function thunk(t, f, size, B) {
  const [g, end] = amp(t, 0.12 + size * 0.15, 0.003, 0, 0.12 + size * 0.3), o = osc('sine', f, t, end);
  o.frequency.exponentialRampToValueAtTime(f * 0.45, t + 0.1 + size * 0.2); o.connect(g); route(g, B, 0.1, 0);
  const [ng, ne] = amp(t, 0.04 + size * 0.1, 0.002, 0, 0.05 + size * 0.3), lp = filt('lowpass', 700);
  noiseSrc(t, ne).connect(lp); lp.connect(ng); route(ng, B, 0.15, 0);
}
function sfx(name) {
  const c = AU.ctx; if (!SET.sfx || !c || c.state !== 'running') return;
  const t = c.currentTime + 0.01;
  if (t - (sfxLast[name] ?? -9) < (SFX_GAP[name] || 0.1) || (name === 'tick' && t - sfxAny < 0.08)) return;
  sfxLast[name] = t; sfxAny = t;
  const k = 60 + (M.tr ? M.tr.key : 60) % 12, B = AU.sb, I = INST;
  switch (name) {
    case 'tick': blip(t, mtof(k + 36), 0.025, 0.03, 'triangle', B); break;
    case 'mark': blip(t, mtof(k + 24), 0.03, 0.04, 'sine', B); break;
    case 'pip': blip(t, mtof(k + 28), 0.09, 0.07, 'sine', B, 1.06); break;
    case 'scan': blip(t, mtof(k + 31), 0.12, 0.025, 'sine', B, 1.03); break;
    case 'dig': thunk(t, 140 + Math.random() * 40, 0.1, B); break;
    case 'charge': thunk(t, 90, 0.6, B); break;
    case 'unload': I.marimba(t, k, 0.2, 0.5, B); I.marimba(t + 0.09, k + 7, 0.3, 0.45, B); break;
    case 'coin': I.bell(t, k + 24, 0.2, 0.45, B); I.bell(t + 0.07, k + 31, 0.3, 0.4, B); break;
    case 'made': I.kalimba(t, k + 19, 0.2, 0.3, B); break;
    case 'good': [0, 4, 7].forEach((d, i) => I.keys(t + i * 0.07, k + 12 + d, 0.4, 0.5, B)); break;
    case 'goal': [0, 4, 7, 12].forEach((d, i) => I.bell(t + i * 0.09, k + 12 + d, 0.6, 0.55, B)); break;
    case 'bad': I.pluck(t, k + 3, 0.2, 0.7, B); I.pluck(t + 0.11, k, 0.3, 0.6, B); break;
  }
}

/* ---------- switches used by the settings window ---------- */
function audioUnlock() {
  if (!audioInit()) return;
  audioSync();
  if (SET.music && !M.on && !M.nextAt) startTrack(SET.track >= 0 ? SET.track : Math.floor(Math.random() * TRACKS.length));
}
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, audioUnlock, { capture: true }));
function setMusic(on) {
  SET.music = on; saveSettings(); if (!audioInit()) return; audioSync();
  if (!on) { M.on = false; M.nextAt = 0; setBusGain(AU.mb, 0, 0.3); }
  else if (!M.on && !M.nextAt) startTrack(SET.track >= 0 ? SET.track : M.ti);
}
function setMusicVol(v) { SET.musicVol = v; saveSettings(); if (AU.ctx && M.on) setBusGain(AU.mb, musicLevel()); }
function setSfx(on) { SET.sfx = on; saveSettings(); if (AU.ctx) { setBusGain(AU.sb, sfxLevel()); audioSync(); } }
function setSfxVol(v) { SET.sfxVol = v; saveSettings(); if (AU.ctx) setBusGain(AU.sb, sfxLevel()); }
function pickTrack(i) { SET.track = i; saveSettings(); if (AU.ctx && SET.music && i >= 0 && (i !== M.ti || !M.on)) switchTrack(i); }
function nextTrack() {
  const i = (M.ti + 1) % TRACKS.length;
  if (SET.track >= 0) { SET.track = i; saveSettings(); }
  if (AU.ctx && SET.music) switchTrack(i);
  syncSettingsUI();
}

function buildLegend() {
  const L = $('#legend');

/* ---------- optional rewarded ad (phone app only) ---------- */
const supportBtn = $('#supportBtn');
$('#supportLabel').textContent = AD.buttonLabel;
let adPlugin = null, adReady = false, adBusy = false;
function nativeAdMob() {
  try {
    const cap = window.Capacitor;
    if (!cap || typeof cap.isNativePlatform !== 'function' || !cap.isNativePlatform()) return null;
    if (!adPlugin) adPlugin = typeof cap.registerPlugin === 'function' ? cap.registerPlugin('AdMob') : (cap.Plugins && cap.Plugins.AdMob) || null;
    return adPlugin;
  } catch (e) { return null; }
}
async function prepareAds(A) {
  if (adReady) return true;
  const info = await A.requestConsentInfo();
  let can = info.canRequestAds !== false;
  if (info.isConsentFormAvailable && info.status === 'REQUIRED') { const after = await A.showConsentForm(); can = !after || after.canRequestAds !== false; }
  if (!can) return false;
  await A.initialize({ initializeForTesting: !!AD.testing });
  adReady = true; return true;
}
async function watchAd() {
  const A = nativeAdMob();
  if (!A) { toast('Ads only play in the phone app version of Quiet Quarry.'); return; }
  if (adBusy) return;
  adBusy = true; supportBtn.disabled = true;
  const prev = G.speed; setSpeed(0);
  let rewarded = false; const handles = [];
  const grant = () => { if (rewarded) return; rewarded = true; G.items.turbo++; toast('Thanks for watching. You got 1 Turbo fuel.', 'good'); };
  try {
    if (!(await prepareAds(A))) throw new Error('no consent');
    try { handles.push(await A.addListener('onRewardedVideoAdReward', grant)); } catch (e) {}
    const platform = window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : 'android';
    await A.prepareRewardVideoAd({ adId: platform === 'ios' ? AD.iosRewardedAdUnitId : AD.androidRewardedAdUnitId, isTesting: !!AD.testing });
    AU.held = true; audioSync();   // the ad has its own sound
    const item = await A.showRewardVideoAd();
    if (item && (item.amount > 0 || item.type)) grant();
  } catch (e) {
    if (!rewarded) toast('No ad is available right now. Please try again later.', 'bad');
  }
  for (const hd of handles) { try { hd.remove(); } catch (e) {} }
  AU.held = false; audioSync();
  setSpeed(prev); adBusy = false; supportBtn.disabled = false;
}
supportBtn.addEventListener('click', watchAd);

      for (let r = 1; r < NR; r++) s += `<span>${RINFO[r].name} delivered</span><span>${Bd(() => tons(G.stats.extracted[RES[r]] || 0))}</span>`;
      s += `<span>Map seed</span><span>${G.seed}</span></div>`;
      return s;
    },
  },
};
function helpHTML() {
  return `<div class="hd"><h2>Survey the ground, then dig</h2></div>
  <p class="muted">Every cube holds 100 t of rock. Until you survey it, you don't know what is inside. Find the veins, mark them for digging, and your miners bring the ore to the landing pad.</p>
  <h3>Getting started</h3>
  <div class="keys">
    <span class="mono">1</span><span>Your drone is already scanning. Coloured dots show traces it finds.</span>
    <span class="mono">2</span><span>Click a promising column and use a <b>Core drill</b> or <b>Probe</b> for exact percentages.</span>
    <span class="mono">3</span><span>Pick <b>Mark dig</b> and paint over the ore. Miners start right away.</span>
    <span class="mono">4</span><span>Sell ore in <b>Storage</b>, or build a <b>Smelter</b> in <b>Base</b> to refine it.</span>
    <span class="mono">5</span><span>Keep digging to unlock more land in the <b>Land</b> tab.</span>
  </div>
  <h3>Controls</h3>
  <div class="keys">
    <kbd>Drag</kbd><span>Pan (right-drag also pans in dig mode)</span>
    <kbd>Wheel</kbd><span>Zoom, or pinch on touch screens</span>
    <kbd>WASD</kbd><span>Pan with the keyboard</span>
    <kbd>1–7</kbd><span>Switch tools</span>
    <kbd>Space</kbd><span>Pause or resume</span>
    <kbd>H</kbd><span>Centre on the landing pad</span>
    <kbd>M</kbd><span>Music on or off (more in Settings, the gear button)</span>
  </div>
  <h3>Reading the map</h3>
  <p class="sub">Green and brown cubes are unsurveyed. Tinted cubes with dots have traces. Fully coloured cubes are assayed, and their colour blends their contents. Use <b>Cutaway</b> to slice off upper layers and the heat-map views to follow one metal. Darkened land around yours is for sale.</p>`;
}
function baseTileHTML(x, y) {
  const ci = y * W + x;
  if (kind[ci] === 2) return `<div class="hd"><h2>Landing pad</h2></div><p class="muted">Vehicles bring everything they dig here, and drones recharge here.</p>${Btn('Open storage', 'tab', 'storage')}`;
  if (kind[ci] === 3) {
    const li = lotOf[ci], b = G.buildings.find(b => b.lot === li);
    return `<div class="hd"><h2>Lot ${li + 1}</h2><span class="pill ${b ? 'good' : ''}">${b ? BDEF[b.type].name : 'Empty'}</span></div><p class="muted">${b ? BDEF[b.type].desc : 'Flat foundation ready for a building. Construct one from the Base tab.'}</p>${Btn('Open base', 'tab', 'base')}`;
  }
  return `<div class="hd"><h2>Base road</h2></div><p class="muted">Concrete foundation around the pad. It can't be dug.</p>`;
}
const hudFlags = { anyDig: false, scanLeft: true };
function vehStatus(v) {
  const at = ci => `${ci % W},${ci / W | 0}`;
  if (v.type === 'drone') {
    return { idle: hudFlags.scanLeft ? 'On the pad, picking a target' : 'On the pad, nothing left to survey', toScan: `Flying to ${v.job >= 0 ? at(v.job) : '…'}`, scanning: `Scanning around ${v.job >= 0 ? at(v.job) : '…'}`, toPad: 'Flying back to recharge', charging: 'Recharging on the pad' }[v.state] || v.state;
  }
  return { idle: hudFlags.anyDig ? 'On the pad, heading out' : 'Parked. Mark ground to dig', toSite: `Driving to ${v.job >= 0 ? at(v.job) : '…'}`, mining: `Digging ${v.job >= 0 ? at(v.job) + ',' + (h[v.job] - 1) : ''}`, toPad: `Hauling ${v.load.toFixed(1)} t to the pad`, unloading: 'Unloading at the pad' }[v.state] || v.state;
}
function refreshFlags() {
  let dig = false, scan = false; const lvl = droneLevel();
  for (let i = 0; i < ownedCols.length && !(dig && scan); i++) {
    const ci = ownedCols[i]; if (kind[ci] || h[ci] <= 1) continue;
    if (designated[ci]) dig = true;
    if (!scan && survey[vi(ci % W, ci / W | 0, h[ci] - 1)] < lvl) scan = true;
  }
  hudFlags.anyDig = dig; hudFlags.scanLeft = scan;
}
function bStatus(b) {
  if (!b.on) return 'Paused';
  if (b.type === 'assembly') return b.queue.length ? `Building ${RECIPES[b.queue[0]].label} · ${Math.floor(b.prog * 100)}%` : 'Idle. Queue something below';
  if (b.busy) return `Making ${GOODS[RECIPES[b.cur].out].name} · ${Math.floor(b.prog * 100)}%`;
  return `Waiting for ${missingText(RECIPES[b.recipe].in)}`;
}
function stockValue() { let s = 0; for (const k of GOOD_KEYS) s += Math.floor(G.storage[k] + 1e-9) * priceOf(k); return s; }
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min ${String(s).padStart(2, '0')} s`; }

function refreshPanel(force) {
  const T = TABS[P.tab], sig = P.tab + '#' + T.sig();
  if (force || sig !== P.sig) {
    const scroll = tabBody.scrollTop, sameTab = P.sig.split('#')[0] === P.tab;
    P.binds = []; P.enables = [];
    tabBody.innerHTML = T.render();
    P.bEls = [...tabBody.querySelectorAll('[data-b]')]; P.wEls = [...tabBody.querySelectorAll('[data-w]')]; P.eEls = [...tabBody.querySelectorAll('[data-e]')];
    P.sig = sig; if (sameTab) tabBody.scrollTop = scroll; else tabBody.scrollTop = 0;
  }
  for (const el of P.bEls) { const v = String(P.binds[+el.dataset.b]()); if (el._v !== v) { el._v = v; el.textContent = v; } }
  for (const el of P.wEls) { const v = clamp(+P.binds[+el.dataset.w](), 0, 100).toFixed(1) + '%'; if (el._v !== v) { el._v = v; el.style.width = v; } }
  for (const el of P.eEls) { const ok = !!P.enables[+el.dataset.e](); if (el.disabled === ok) el.disabled = !ok; }
}
function centreOnRegion(r) { const x = (r % RN) * REG + 24, y = (r / RN | 0) * REG + 24; cam.x = isoX(x, y); cam.y = isoY(x, y, h[y * W + x]); if (cam.zoom > 1) cam.zoom = 1; clampCam(); lastZoomAt = performance.now(); }
const ACT = {
  tab: t => setTab(t),
  land: r => openLand(+r),
  landSel: r => { landSel = +r; },
  buyLand: r => buyRegion(+r),
  showRegion: r => centreOnRegion(+r),
  dig: () => { if (sel >= 0) setDig(sel, !designated[sel]); },
  probe: () => useProbe(sel), core: () => useCore(sel), charge: () => useCharge(sel), focus: () => setFocus(sel),
  centre: () => { if (sel >= 0) { const x = sel % W, y = sel / W | 0; cam.x = isoX(x + .5, y + .5); cam.y = isoY(x + .5, y + .5, h[sel]); } },
  locate: id => { const v = G.vehicles.find(v => v.id === +id); if (v) { cam.x = isoX(v.x, v.y); cam.y = isoY(v.x, v.y, v.vz || BASE_H); } },
  buyVeh: k => buyVehicle(k), buyItem: k => buyItem(k),
  sell: a => { const [k, n] = a.split(':'); sell(k, n === 'all' ? Infinity : +n); },
  buyBld: k => construct(k, true), buildBld: k => construct(k, false),
  recipe: (id, el) => { const b = G.buildings.find(b => b.id === +id); if (b) b.recipe = el.value; },
  queue: a => { const [id, rid] = a.split(':'); queueRecipe(+id, rid); },
  toggleB: id => { const b = G.buildings.find(b => b.id === +id); if (b) b.on = !b.on; },
  demolish: (id, el) => {
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = 'Confirm'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.classList.remove('armed'); el.textContent = 'Demolish'; } }, 3500); return false; }
    const i = G.buildings.findIndex(b => b.id === +id);
    if (i >= 0) { const b = G.buildings[i]; G.buildings.splice(i, 1); markCol(LOTS[b.lot].x, LOTS[b.lot].y); toast(`${BDEF[b.type].name} demolished. Queued jobs and stock inside it are lost.`, 'bad'); }
  },
  upg: k => installUpgrade(k),
};
tabBody.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  const r = ACT[b.dataset.act] && ACT[b.dataset.act](b.dataset.arg, b);
  if (r !== false) refreshPanel(true);
});
tabBody.addEventListener('change', e => {
  const s = e.target.closest('select[data-act]'); if (!s) return;
  ACT[s.dataset.act] && ACT[s.dataset.act](s.dataset.arg, s);
});

function updateHud() {
  $('#cash').textContent = money(G.cash);
  let ore = 0; for (const k of GOOD_KEYS) if (GOODS[k].raw) ore += G.storage[k];
  $('#oreTotal').textContent = tons(ore);
  $('#tcCore').textContent = '×' + G.items.coreDrill; $('#tcCharge').textContent = '×' + G.items.surveyCharge; $('#tcTurbo').textContent = '×' + G.items.turbo;
  const tp = $('#turboPill'); tp.hidden = !(G.turbo > 0); if (G.turbo > 0) tp.textContent = `Turbo ${Math.ceil(G.turbo)} s`;
}
function checkGoals() {
  for (const g of GOALS) {
    if (G.goals[g.id]) continue;
    if (g.done()) { G.goals[g.id] = 1; G.cash += g.reward; toast(`Goal reached: ${g.text}${g.reward ? ' (+' + money(g.reward) + ')' : ''}`, 'good', 'goal'); }
  }
}

/* =====================================================================
   SAVE / LOAD
   ===================================================================== */
function rle(arr) { const out = []; let i = 0; const n = arr.length; while (i < n) { const v = arr[i]; let j = i + 1; while (j < n && arr[j] === v) j++; out.push(v, j - i); i = j; } return out; }
function serialize() {
  const hd = [], dig = [], rem = [];
  for (let i = 0; i < NCOL; i++) {
    if (h[i] !== origH[i]) hd.push(i, h[i]);
    if (designated[i]) dig.push(i);
    if (remain[i] < VOX_T) rem.push(i, Math.round(remain[i] * 100) / 100);
  }
  return { v: 3, G, hd, rem, sv: rle(survey), dig };
}
function setupState(g) {
  G = Object.assign(newState(g.seed), g);
  for (const k of GOOD_KEYS) if (typeof G.storage[k] !== 'number') G.storage[k] = 0;
  G.stats = Object.assign(newState(0).stats, g.stats || {});
  G.upgrades = Object.assign(newState(0).upgrades, g.upgrades || {});
  G.items = Object.assign({ coreDrill: 0, surveyCharge: 0, turbo: 0 }, g.items || {});
  if (!Array.isArray(G.owned) || !G.owned.length) G.owned = [HOME_REG];
  G.owned = [...new Set(G.owned.filter(r => Number.isInteger(r) && r >= 0 && r < RN * RN))];
  if (!G.owned.includes(HOME_REG)) G.owned.unshift(HOME_REG);
  if (!G.focus || !Number.isFinite(G.focus.x)) G.focus = { x: CX, y: CY };
  updateRegions();
  reserved.fill(-1);
  for (const v of G.vehicles) {
    if (v.type !== 'drone' && v.job >= 0 && (v.state === 'toSite' || v.state === 'mining')) reserved[v.job] = v.id;
    else if (v.type !== 'drone') v.job = -1;
  }
  for (const b of G.buildings) { b.queue = b.queue || []; if (b.busy && !b.cur) b.busy = false; }
  sel = -1; landSel = -1;
}
function restore(o) {
  if (!o || !o.G || typeof o.G.seed !== 'number') return false;
  if (o.v === 2) return restoreV2(o);
  if (o.v !== 3 || !Array.isArray(o.hd) || !Array.isArray(o.sv)) return false;
  genWorld(o.G.seed);
  for (let i = 0; i < o.hd.length; i += 2) h[o.hd[i]] = o.hd[i + 1];
  for (let i = 0; i < o.rem.length; i += 2) remain[o.rem[i]] = o.rem[i + 1];
  let p = 0; for (let i = 0; i < o.sv.length; i += 2) { survey.fill(clamp(o.sv[i], 0, 2), p, p + o.sv[i + 1]); p += o.sv[i + 1]; }
  for (const i of o.dig) designated[i] = 1;
  setupState(o.G);
  return true;
}
// saves from the first version (one 48×48 map) become the home region of the bigger world
let migrated = false;
function restoreV2(o) {
  if (!Array.isArray(o.h) || o.h.length !== REG * REG || typeof o.sv !== 'string' || o.sv.length !== REG * REG * H) return false;
  genWorld(o.G.seed);
  const map = i => ((i / REG | 0) + OY) * W + (i % REG) + OX;
  for (let i = 0; i < REG * REG; i++) h[map(i)] = o.h[i];
  for (let i = 0; i < (o.rem || []).length; i += 2) remain[map(o.rem[i])] = o.rem[i + 1];
  for (let z = 0; z < H; z++) for (let y = 0; y < REG; y++) for (let x = 0; x < REG; x++) survey[vi(x + OX, y + OY, z)] = clamp(o.sv.charCodeAt((z * REG + y) * REG + x) - 48, 0, 2);
  for (const i of o.dig || []) designated[map(i)] = 1;
  const g = o.G;
  for (const v of g.vehicles || []) { v.x += OX; v.y += OY; v.tx = (v.tx || 0) + OX; v.ty = (v.ty || 0) + OY; if (v.job >= 0) v.job = map(v.job); }
  if (g.focus) g.focus = { x: g.focus.x + OX, y: g.focus.y + OY };
  setupState(g);
  migrated = true;
  return true;
}
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); return true; }
  catch (e) { return false; }
}
function loadGame() {
  try {
    const s = localStorage.getItem(SAVE_KEY); if (s) return restore(JSON.parse(s));
    const old = localStorage.getItem(OLD_SAVE_KEY); if (old) return restore(JSON.parse(old));
    return false;
  } catch (e) { return false; }
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), hudT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  keyPan(dt);
  if (G.speed > 0) { let sd = dt * G.speed; while (sd > 1e-6) { const st = Math.min(0.05, sd); step(st); sd -= st; } }
  stepFx(dt * (G.speed > 0 ? 1 : 0));
  draw(now);
  hudT += dt;
  if (hudT > 0.2) { hudT = 0; checkGoals(); refreshFlags(); updateHud(); refreshPanel(false); }
  saveT += dt;
  if (saveT > 20) { saveT = 0; saveGame(); }
  requestAnimationFrame(frame);
}

function start(data) {
  let ok = false;
  try { if (data && data.save) ok = restore(data.save); } catch (e) { ok = false; }
  if (!ok) ok = loadGame();
  if (!ok) newGame(Math.floor(Math.random() * 1e9) + 1);
  centerOnPad();
  cam.zoom = window.innerWidth < 700 ? 1.1 : 1.6;
  setSpeed(G.speed ?? 1);
  buildLegend(); setTab('inspect'); refreshFlags(); updateHud();
  if (migrated) { toast('Your game moved into the new, bigger world. Your valley is the home region.', 'good'); saveGame(); }
  try { window.claude?.hot?.snapshot?.(() => ({ save: serialize() })); } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  window.addEventListener('pagehide', saveGame);
  requestAnimationFrame(t => { last = t; frame(t); });
}

// test hooks (harmless in play)
window.quietQuarry = {
  get G() { return G; }, step, sell, construct, queueRecipe, installUpgrade, setDig, useCore, useCharge, useProbe, useTurbo,
  pickIso, isoX, isoY, voxelLabel, serialize, restore, newGame, buyVehicle, buyItem, buyRegion, landInfo, landPrice, watchAd,
  world: () => ({ h, origH, comp, survey, designated, kind, remain, LOTS, BASE_H, W, D, H, NR, REG, RN, OX, OY, regVis, colVis, ownedCols, HOME_REG }),
  setSlice: s => { slice = s; worldVer++; }, setOverlay: o => { overlay = o; worldVer++; },
  cam, setTool, mapClick, refreshPanel, setTab, audio: () => ({ AU, M, SET, sfx, nextTrack, setMusic }), chunkStats: () => ({ cachePx, live: chunks.filter(c => c && c.cv).length }),
};

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
